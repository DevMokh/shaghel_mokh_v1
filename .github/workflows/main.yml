name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          mkdir -p /tmp/keep
          cp -r lib /tmp/keep/lib
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          flutter create . --org com.shaghelmokh --project-name shaghel_mokh --platforms android
          rm -rf lib pubspec.yaml test
          cp -r /tmp/keep/lib lib
          cp /tmp/keep/pubspec.yaml pubspec.yaml

      - name: Apply Android overlay (manifest, activity, icons)
        run: |
          cp android_overlay/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/shaghelmokh/shaghel_mokh
          rm -f android/app/src/main/kotlin/com/shaghelmokh/shaghel_mokh/MainActivity.kt
          cp android_overlay/MainActivity.kt android/app/src/main/kotlin/com/shaghelmokh/shaghel_mokh/MainActivity.kt
          cp -r android_overlay/res/* android/app/src/main/res/

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: shaghel-mokh-apk
          path: build/app/outputs/flutter-apk/app-release.apk
